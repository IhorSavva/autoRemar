<script>
// GitHub Pages serves this page at any missing path, so relative links need a <base>.
// shortcut: assumes a project site (user.github.io/repo/) or own domain; a user site at github.io root would get a wrong base.
(function () {
  var p = location.pathname, base = "/";
  if (/\.github\.io$/.test(location.hostname) && p.split("/")[1]) base = "/" + p.split("/")[1] + "/";
  document.write('<base href="' + base + '">');
  // Old Joomla addresses: /index.php/galeria, /index.php/gdzie-jestesmy, ...
  var u = decodeURIComponent(p + location.search).toLowerCase();
  if (u.indexOf("index.php") > -1) {
    location.replace(base + (u.indexOf("galeria") > -1 ? "o-nas.html#galeria"
      : u.indexOf("gdzie-jestesmy") > -1 ? "kontakt.html" : "index.html"));
  }
})();
</script>
